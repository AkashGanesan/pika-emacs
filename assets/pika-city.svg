<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">Pika Emacs city</title>
  <desc id="desc">A luminous far-future city of monumental towers beneath orbital arcs.</desc>
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56658a"/>
      <stop offset="0.5" stop-color="#283451"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ce43"/>
      <stop offset="0.28" stop-color="#806c4d"/>
      <stop offset="1" stop-color="#182238"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fafff"/>
      <stop offset="1" stop-color="#6f89ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2fafff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

