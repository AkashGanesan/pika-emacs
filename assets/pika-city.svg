  <path d="M67 83 Q320 20 573 83" fill="none" stroke="#b6a0ff" stroke-width="1.2" opacity="0.32"/>
  <circle cx="31" cy="70" r="3" fill="#2fafff" filter="url(#glow)"/>
  <circle cx="609" cy="70" r="2.5" fill="#b6a0ff"/>

